[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oedi-2107-physics-model"
version = "0.1.0"
description = "Measured-POA, Faiman and CEC DC foundation for OEDI 2107"
requires-python = ">=3.11"
dependencies = ["pvlib>=0.13,<0.17", "pandas>=2.2,<4", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
